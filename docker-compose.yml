services:
  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://13.204.80.36:5000/api
    container_name: frontend
    restart: always
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
