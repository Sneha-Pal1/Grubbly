name: build-test-deploy

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t backend:latest ./backend

      - name: Build frontend Docker image (NGINX Multi-stage)
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.EC2_HOST || '13.204.80.36' }}:5000/api \
            -t frontend:latest ./frontend

      - name: Log in to Docker Hub (if secrets provided)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub (if secrets provided)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag backend:latest ${DOCKERHUB_USERNAME}/grubbly-backend:latest
          docker tag backend:latest ${DOCKERHUB_USERNAME}/grubbly-backend:${{ github.sha }}
          docker tag frontend:latest ${DOCKERHUB_USERNAME}/grubbly-frontend:latest
          docker tag frontend:latest ${DOCKERHUB_USERNAME}/grubbly-frontend:${{ github.sha }}
          docker push ${DOCKERHUB_USERNAME}/grubbly-backend --all-tags
          docker push ${DOCKERHUB_USERNAME}/grubbly-frontend --all-tags

  deploy:
    needs: build-and-lint
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        id: check_secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "EC2_HOST or EC2_KEY secret is missing. Skipping deployment step."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Add EC2 host to known_hosts
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts || true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Write SSH key
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${EC2_KEY}" > ec2_key.pem
          chmod 600 ec2_key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy on EC2 via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e
            echo "Successfully connected to EC2 instance."

            TARGET_DIR="${EC2_APP_DIR:-$HOME/Grubbly}"
            echo "Target deployment directory: $TARGET_DIR"

            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Git repository not found at $TARGET_DIR. Auto-cloning repository from GitHub..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/Sneha-Pal1/Grubbly.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            echo "Updating source code from GitHub..."
            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main

            echo "Stopping existing conflicting containers..."
            if command -v docker-compose &> /dev/null; then
              docker-compose down --remove-orphans || true
            else
              docker compose down --remove-orphans || true
            fi
            docker rm -f backend frontend || true

            echo "Deploying application containers..."
            if command -v docker-compose &> /dev/null; then
              docker-compose up -d --build
            else
              docker compose up -d --build
            fi

            docker image prune -f || true
            echo "Deployment finished successfully!"
          EOF
