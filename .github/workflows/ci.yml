name: build-test-deploy

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t backend:latest ./backend

      - name: Build frontend Docker image (NGINX Multi-stage)
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.EC2_HOST || '13.204.80.36' }}:5000/api \
            -t frontend:latest ./frontend

      - name: Log in to Docker Hub (if secrets provided)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub (if secrets provided)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/grubbly-backend:latest
          docker tag backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/grubbly-backend:${{ github.sha }}
          docker tag frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/grubbly-frontend:latest
          docker tag frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/grubbly-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/grubbly-backend --all-tags
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/grubbly-frontend --all-tags

  deploy:
    needs: build-and-lint
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push' && secrets.EC2_HOST != '' && secrets.EC2_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Write SSH key
        run: |
          echo "${EC2_KEY}" > ec2_key.pem
          chmod 600 ec2_key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy on EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e
            cd "${EC2_APP_DIR}"

            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main

            docker compose up -d --build

            docker image prune -f

            docker compose ps
          EOF
